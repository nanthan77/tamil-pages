<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Offline · Tamil Canadian Pages</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background: #002D62; color: #FFFFFF; min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 24px; text-align: center; }
    .card { background: rgba(255, 255, 255, 0.08); border: 1px solid rgba(255, 255, 255, 0.18); border-radius: 28px; padding: 36px 24px; max-width: 440px; width: 100%; box-shadow: 0 20px 40px rgba(0,0,0,0.4); backdrop-filter: blur(10px); }
    .icon { font-size: 56px; margin-bottom: 16px; display: inline-block; }
    h1 { font-size: 24px; font-weight: 900; margin-bottom: 8px; }
    .tamil { color: #FFD700; font-weight: 700; font-size: 15px; margin-bottom: 16px; }
    p { color: #E2E8F0; font-size: 14px; line-height: 1.6; margin-bottom: 24px; }
    .btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; background: #E00624; color: #FFFFFF; font-weight: 800; font-size: 14px; padding: 14px 28px; border-radius: 16px; border: none; cursor: pointer; text-decoration: none; box-shadow: 0 4px 14px rgba(224, 6, 36, 0.4); transition: transform 0.2s; width: 100%; }
    .btn:active { transform: scale(0.98); }
    .links { margin-top: 20px; display: flex; justify-content: center; gap: 16px; font-size: 12px; }
    .links a { color: #93C5FD; text-decoration: underline; font-weight: 600; }
  </style>
</head>
<body>
  <div class="card">
    <div class="icon">🍁</div>
    <h1>You are currently offline</h1>
    <div class="tamil">இணைய இணைப்பு இல்லை — தயவுசெய்து மீண்டும் முயற்சிக்கவும்</div>
    <p>TamilCanadianPages needs an active internet connection to load live business numbers, temple schedules, and movie showtimes.</p>
    <button class="btn" onclick="window.location.reload()">
      <span>🔄</span>
      <span>Retry Connection</span>
    </button>
    <div class="links">
      <a href="/">Home</a>
      <a href="/temples">Temples</a>
      <a href="/cinema">Cinema</a>
    </div>
  </div>

  <script>
    window.addEventListener('online', () => {
      window.location.reload();
    });
  </script>
</body>
</html>
